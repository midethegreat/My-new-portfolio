<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .text-field {
            min-height: 140px;
            resize: vertical;
        }
        .loading-spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .language-card {
            transition: all 0.3s ease;
            border-radius: 16px;
        }
        .language-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .translate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .translate-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .swap-btn {
            transition: all 0.3s ease;
        }
        .swap-btn:hover {
            transform: rotate(180deg);
            color: #667eea;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const languages = [
            { code: 'en', name: 'English', flag: '🇺🇸' },
            { code: 'es', name: 'Spanish', flag: '🇪🇸' },
            { code: 'fr', name: 'French', flag: '🇫🇷' },
            { code: 'de', name: 'German', flag: '🇩🇪' },
            { code: 'it', name: 'Italian', flag: '🇮🇹' },
            { code: 'pt', name: 'Portuguese', flag: '🇵🇹' },
            { code: 'ru', name: 'Russian', flag: '🇷🇺' },
            { code: 'ja', name: 'Japanese', flag: '🇯🇵' },
            { code: 'zh', name: 'Chinese', flag: '🇨🇳' },
            { code: 'ar', name: 'Arabic', flag: '🇸🇦' },
            { code: 'hi', name: 'Hindi', flag: '🇮🇳' },
            { code: 'ko', name: 'Korean', flag: '🇰🇷' }
        ];

        const TranslatorApp = () => {
            const [sourceText, setSourceText] = useState('');
            const [translatedText, setTranslatedText] = useState('');
            const [sourceLang, setSourceLang] = useState('en');
            const [targetLang, setTargetLang] = useState('es');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [translationHistory, setTranslationHistory] = useState([]);

            const translateText = async () => {
                if (!sourceText.trim()) {
                    setError('Please enter text to translate');
                    return;
                }

                setIsLoading(true);
                setError('');

                try {
                    const response = await fetch('https://libretranslate.de/translate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            q: sourceText,
                            source: sourceLang,
                            target: targetLang,
                            format: 'text'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Translation service is currently unavailable. Please try again later.');
                    }

                    const data = await response.json();
                    setTranslatedText(data.translatedText);
                    
                    const newTranslation = {
                        sourceText,
                        translatedText: data.translatedText,
                        sourceLang,
                        targetLang,
                        timestamp: new Date().toLocaleTimeString()
                    };
                    setTranslationHistory(prev => [newTranslation, ...prev.slice(0, 3)]);
                    
                } catch (err) {
                    setError(err.message || 'Failed to translate. Please check your connection and try again.');
                } finally {
                    setIsLoading(false);
                }
            };

            const swapLanguages = () => {
                setSourceLang(targetLang);
                setTargetLang(sourceLang);
                setSourceText(translatedText);
                setTranslatedText(sourceText);
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
            };

            const speakText = (text, lang) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'zh' ? 'zh-CN' : lang;
                speechSynthesis.speak(utterance);
            };

            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full mb-4">
                                <svg className="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
                                </svg>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">Multilingual Translator</h1>
                            <p className="text-white/80">Translate between 12 languages instantly</p>
                        </div>

                        {/* Main Translation Area */}
                        <div className="glass-effect rounded-2xl p-6 mb-8 language-card">
                            <div className="grid md:grid-cols-2 gap-6">
                                {/* Source Language */}
                                <div>
                                    <div className="flex items-center justify-between mb-4">
                                        <span className="text-sm font-medium text-gray-600">Translate from</span>
                                        <select
                                            value={sourceLang}
                                            onChange={(e) => setSourceLang(e.target.value)}
                                            className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-purple-500"
                                        >
                                            {languages.map(lang => (
                                                <option key={lang.code} value={lang.code}>
                                                    {lang.flag} {lang.name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <textarea
                                        value={sourceText}
                                        onChange={(e) => setSourceText(e.target.value)}
                                        placeholder="Enter text here..."
                                        className="w-full text-field p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-gray-800 bg-white"
                                        rows="5"
                                    />
                                    <div className="flex justify-between items-center mt-3">
                                        <span className="text-xs text-gray-500">
                                            {sourceText.length} characters
                                        </span>
                                        <button
                                            onClick={() => copyToClipboard(sourceText)}
                                            className="text-xs text-purple-600 hover:text-purple-800 flex items-center"
                                        >
                                            <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2" />
                                            </svg>
                                            Copy
                                        </button>
                                    </div>
                                </div>

                                {/* Target Language */}
                                <div>
                                    <div className="flex items-center justify-between mb-4">
                                        <span className="text-sm font-medium text-gray-600">Translate to</span>
                                        <select
                                            value={targetLang}
                                            onChange={(e) => setTargetLang(e.target.value)}
                                            className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-purple-500"
                                        >
                                            {languages.map(lang => (
                                                <option key={lang.code} value={lang.code}>
                                                    {lang.flag} {lang.name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="p-4 border border-gray-200 rounded-lg bg-white min-h-[140px] text-gray-800">
                                        {isLoading ? (
                                            <div className="flex items-center justify-center h-full">
                                                <div className="loading-spinner"></div>
                                                <span className="text-gray-500 ml-2">Translating...</span>
                                            </div>
                                        ) : (
                                            translatedText ? (
                                                <>
                                                    <p className="whitespace-pre-wrap">{translatedText}</p>
                                                    <div className="flex space-x-4 mt-4">
                                                        <button
                                                            onClick={() => copyToClipboard(translatedText)}
                                                            className="text-sm text-purple-600 hover:text-purple-800 flex items-center"
                                                        >
                                                            <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2" />
                                                            </svg>
                                                            Copy
                                                        </button>
                                                        <button
                                                            onClick={() => speakText(translatedText, targetLang)}
                                                            className="text-sm text-purple-600 hover:text-purple-800 flex items-center"
                                                        >
                                                            <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072M12 6a9 9 0 010 12m-4.5-9.5a13.5 13.5 0 010 15" />
                                                            </svg>
                                                            Speak
                                                        </button>
                                                    </div>
                                                </>
                                            ) : (
                                                <p className="text-gray-400 italic">Translation will appear here</p>
                                            )
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="flex items-center justify-center space-x-4 mt-8">
                                <button
                                    onClick={translateText}
                                    disabled={isLoading || !sourceText.trim()}
                                    className="translate-btn px-8 py-3 text-white rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {isLoading ? 'Translating...' : 'Translate Text'}
                                </button>
                                
                                <button
                                    onClick={swapLanguages}
                                    disabled={isLoading}
                                    className="swap-btn p-3 text-gray-600 hover:text-purple-600"
                                    title="Swap languages"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                                    </svg>
                                </button>
                            </div>

                            {/* Error Message */}
                            {error && (
                                <div className="mt-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
                                    <span className="font-medium">Error:</span> {error}
                                </div>
                            )}
                        </div>

                        {/* Translation History */}
                        {translationHistory.length > 0 && (
                            <div className="glass-effect rounded-2xl p-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-semibold text-gray-800">Recent Translations</h2>
                                    <span className="text-sm text-gray-500">{translationHistory.length} items</span>
                                </div>
                                <div className="space-y-3">
                                    {translationHistory.map((item, index) => (
                                        <div key={index} className="p-4 bg-white border border-gray-100 rounded-lg hover:bg-gray-50 transition-colors">
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="text-xs text-gray-500">{item.timestamp}</span>
                                                <span className="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded-full">
                                                    {languages.find(l => l.code === item.sourceLang)?.flag} → {languages.find(l => l.code === item.targetLang)?.flag}
                                                </span>
                                            </div>
                                            <div className="grid md:grid-cols-2 gap-4">
                                                <div className="text-sm text-gray-600">
                                                    <div className="font-medium mb-1">Original:</div>
                                                    <p className="whitespace-pre-wrap">{item.sourceText}</p>
                                                </div>
                                                <div className="text-sm text-gray-800">
                                                    <div className="font-medium mb-1">Translation:</div>
                                                    <p className="whitespace-pre-wrap">{item.translatedText}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Footer */}
                        <div className="text-center mt-8">
                            <p className="text-white/60 text-sm">Supports 12 languages with text-to-speech functionality</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<TranslatorApp />, document.getElementById('root'));
    </script>
</body>
</html>
